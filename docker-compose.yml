name: whats-boot

# Ambiente de DESENVOLVIMENTO.
# Sobe: PostgreSQL, Redis, API (Express) e Web (Vite). Nginx só em produção
# (ver infra/compose/docker-compose.prod.yml).
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose logs -f api web

services:
  postgres:
    image: postgres:16-alpine
    container_name: wb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatsboot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatsboot}
      POSTGRES_DB: ${POSTGRES_DB:-whatsboot}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-whatsboot}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whats-boot

  redis:
    image: redis:7-alpine
    container_name: wb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whats-boot

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    container_name: wb-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 3333
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-whatsboot}:${POSTGRES_PASSWORD:-whatsboot}@postgres:5432/${POSTGRES_DB:-whatsboot}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh}
    ports:
      - '3333:3333'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
    networks:
      - whats-boot

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    container_name: wb-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:3333
      VITE_SOCKET_URL: http://localhost:3333
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/app/apps/web
      - /app/node_modules
    networks:
      - whats-boot

networks:
  whats-boot:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
