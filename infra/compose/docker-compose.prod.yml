name: whats-boot-prod

# Produção: postgres, redis, api, worker e nginx (web estático + reverse proxy).
# Rode a partir da raiz do repositório:
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [whats-boot]

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [whats-boot]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    networks: [whats-boot]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: prod
    restart: always
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    networks: [whats-boot]

  nginx:
    build:
      context: ../..
      dockerfile: infra/nginx/Dockerfile
    restart: always
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro   # monte seus certificados para HTTPS
    networks: [whats-boot]

networks:
  whats-boot:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
