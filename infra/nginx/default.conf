# Reverse proxy + serving do SPA (produção).
# HTTPS: descomente o bloco 443 e monte os certificados (ex.: Let's Encrypt).

# Compressão
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css text/javascript
  application/javascript application/json application/xml
  image/svg+xml;

# Zona de rate limit (defesa adicional na borda)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream whats_boot_api {
  server api:3333;
}

server {
  listen 80;
  server_name _;

  # Segurança
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # --- API REST ---
  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://whats_boot_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- WebSocket (Socket.IO) ---
  location /socket.io/ {
    proxy_pass http://whats_boot_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # --- SPA (fallback para o index.html) ---
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

